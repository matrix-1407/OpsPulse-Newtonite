services:
  postgres:
    image: postgres:16-alpine
    container_name: opspulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspulse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-opspulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspulse} -d ${POSTGRES_DB:-opspulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
